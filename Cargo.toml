[workspace]
resolver = "2"
members = [
    "mesh-core",
    "topology-overlay",
    "mesh-editor-core",
    "utils/event-emitter",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"
# repository = "https://github.com/<you>/mesh-editor"

[workspace.dependencies]
bitflags = "2"
bytemuck = { version = "1", features = ["extern_crate_alloc"] }
glam = "0.29"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
slotmap = "1.0"
# `js` serializes through serde-wasm-bindgen, matching our manual conversions.
tsify = { version = "0.5.8", default-features = false, features = ["js"] }
wasm-bindgen = "0.2"

# Release profile tuned for a small, fast wasm binary.
[profile.release]
opt-level = "s"   # optimize for size; switch to "3" if you need raw speed
lto = true
codegen-units = 1
panic = "abort"   # no unwinding tables -> smaller wasm (Rust's analog of -fno-exceptions)
strip = true
