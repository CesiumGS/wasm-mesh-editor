[package]
name = "mesh-editor"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
description = "WebAssembly mesh editor consumed by CesiumJS: a headless mesh kernel with an editor, tools, and GPU-ready topology overlay, exposed to JS via wasm-bindgen."
keywords = ["mesh", "editor", "webassembly", "wasm", "cesium"]

[lib]
# cdylib -> the .wasm artifact; rlib -> native consumers and tests.
crate-type = ["cdylib", "rlib"]

[features]
# Exposes the editor to JS through wasm-bindgen. Enabled when building with wasm-pack.
wasm = [
    "dep:wasm-bindgen",
    "dep:js-sys",
    "dep:serde",
    "dep:serde-wasm-bindgen",
    "dep:tsify",
    "mesh/wasm",
]

[dependencies]
glam.workspace = true
js-sys = { workspace = true, optional = true }
mesh = { path = "../mesh" }
serde = { workspace = true, optional = true }
serde-wasm-bindgen = { workspace = true, optional = true }
slotmap.workspace = true
topology-overlay = { path = "../topology-overlay" }
tsify = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }

# wasm-pack runs `wasm-opt`; modern rustc emits ops (bulk memory:
# memory.copy/fill, sign-ext, nontrapping float->int) that older binaryen
# rejects unless the features are enabled. They're supported in all modern
# browsers, so enable them and keep size optimization on.
[package.metadata.wasm-pack.profile.release]
wasm-opt = [
    '-Os',
    '--enable-bulk-memory',
    '--enable-sign-ext',
    '--enable-nontrapping-float-to-int',
]
